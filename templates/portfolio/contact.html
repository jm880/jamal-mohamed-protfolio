{% extends 'portfolio/base.html' %}{% block content %}<main class="inner-page"><div class="section-label">CONTACT / TRANSMIT</div><h1>Send a <em>message.</em></h1><form class="contact-form standalone" method="post">{% csrf_token %}{{ form.website }}<label>Name{{ form.name }}</label><label>Email{{ form.email }}</label><label>Subject{{ form.subject }}</label><label>Message{{ form.message }}</label>{% if form.errors %}<p class="form-errors">Please check the fields and try again.</p>{% endif %}<button class="button primary">Send message ↗</button></form></main>{% endblock %}
